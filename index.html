<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BuyKaro - Buy & Sell India</title>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f1f3f6;color:#222}
header{background:#087f5b;color:white;padding:18px;text-align:center}
header h1{margin:0;font-size:30px}
header p{margin:8px 0 0}
main{max-width:700px;margin:18px auto;padding:12px}
.box{background:white;padding:16px;margin-bottom:16px;border-radius:12px}
input,textarea,button{width:100%;padding:12px;margin:7px 0;border:1px solid #ccc;border-radius:7px;font-size:16px}
button{background:#087f5b;color:white;border:0;font-weight:bold;cursor:pointer}
.item{background:white;border:1px solid #ddd;padding:12px;margin:12px 0;border-radius:10px}
.item img{width:100%;max-height:250px;object-fit:contain;background:#f5f5f5}
.price{color:#087f5b;font-size:22px;font-weight:bold}
footer{text-align:center;padding:20px;color:#666}
</style>
</head>

<body>
<header>
<h1>🛍️ BuyKaro</h1>
<p>India ka Apna Buying & Selling Platform 🇮🇳</p>
</header>

<main>
<div class="box">
<h2>🔍 Product Search</h2>
<input id="search" placeholder="Mobile, bike, clothes..." oninput="showProducts()">
</div>

<div class="box">
<h2>📦 Apna Product Becho</h2>
<input id="name" placeholder="Product ka naam">
<input id="price" type="number" placeholder="Price ₹">
<input id="phone" type="tel" placeholder="Contact mobile number">
<textarea id="description" placeholder="Product ki details"></textarea>
<label>Product ki photo:</label>
<input id="photo" type="file" accept="image/*">
<button onclick="addProduct()">Product Post Karo</button>
<p id="message"></p>
</div>

<div class="box">
<h2>🛒 Available Products</h2>
<div id="products"></div>
</div>
</main>

<footer>BuyKaro © 2026 | Made in India 🇮🇳</footer>

<script>
let products=JSON.parse(localStorage.getItem("buykaro_products")||"[]");

function showProducts(){
let query=document.getElementById("search").value.toLowerCase();
let area=document.getElementById("products");
area.innerHTML="";
let found=products.filter(p=>p.name.toLowerCase().includes(query)||p.description.toLowerCase().includes(query));

if(found.length===0){
area.innerHTML="<p>Abhi koi product nahi mila. Pehla product post karo!</p>";
return;
}

found.slice().reverse().forEach(p=>{
let div=document.createElement("div");
div.className="item";

let title=document.createElement("h3");
title.textContent=p.name;
div.appendChild(title);

if(p.photo){
let img=document.createElement("img");
img.src=p.photo;
img.alt=p.name;
div.appendChild(img);
}

let price=document.createElement("p");
price.className="price";
price.textContent="₹"+p.price;
div.appendChild(price);

let desc=document.createElement("p");
desc.textContent=p.description;
div.appendChild(desc);

let contact=document.createElement("button");
contact.textContent="Seller se Contact Karo";
contact.onclick=()=>window.open("https://wa.me/91"+p.phone.replace(/\D/g,""),"_blank");
div.appendChild(contact);

area.appendChild(div);
});
}

function addProduct(){
let name=document.getElementById("name").value.trim();
let price=document.getElementById("price").value;
let phone=document.getElementById("phone").value.trim();
let description=document.getElementById("description").value.trim();
let file=document.getElementById("photo").files[0];

if(!name||!price||!phone||!description){
alert("Bhai, saari details bharo!");
return;
}
if(!/^[6-9]\d{9}$/.test(phone)){
alert("10 digit ka sahi Indian mobile number daalo.");
return;
}
if(products.length>=50){
alert("Demo mein maximum 50 products rakh sakte ho.");
return;
}

function save(photo){
products.push({name,price,phone,description,photo});
try{
localStorage.setItem("buykaro_products",JSON.stringify(products));
document.getElementById("message").textContent="Product post ho gaya!";
["name","price","phone","description","photo"].forEach(id=>document.getElementById(id).value="");
showProducts();
}catch(e){
products.pop();
alert("Storage full hai. Chhoti photo try karo.");
}
}

if(file){
if(file.size>700000){
alert("Bhai, 700 KB se chhoti photo select karo.");
return;
}
let reader=new FileReader();
reader.onload=()=>save(reader.result);
reader.readAsDataURL(file);
}else{
save("");
}
}

showProducts();
</script>
</body>
</html>
